name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Only the browsers playwright.config.js actually enables.
      - run: npx playwright install --with-deps chromium firefox webkit

      # Playwright's webServer starts `npm run dev` (esbuild on :8000) itself.
      - run: npm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [build, test]
    # Only tags. The "is it on main" check happens below, since a tag ref
    # carries no branch information on its own.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not an ancestor of main. Not publishing."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is contained in main."

      - name: Verify the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies version ${tag_version}, but package.json says ${pkg_version}."
            exit 1
          fi
          echo "Publishing version ${pkg_version}."

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Scope the package to this repository owner
        # GitHub Packages only accepts packages scoped to the owning org/user,
        # so rewrite the unscoped name in package.json just before publishing.
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          base="$(node -p "require('./package.json').name.replace(/^@[^/]+\//, '')")"
          npm pkg set name="@${owner}/${base}"
          echo "Publishing as @${owner}/${base}"

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
